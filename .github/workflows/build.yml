name: Build and test Notebook RS

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Resolve dependencies
        run: cargo generate-lockfile
      - name: Format sources
        run: cargo fmt
      - name: Test
        run: |
          set +e
          cargo test --color never > build.log 2>&1
          result=$?
          cat build.log
          if [ "$result" -ne 0 ]; then
            escaped=$(tail -c 2700 build.log | sed 's/%/%25/g;s/\r/%0D/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Rust diagnostics::$escaped"
          fi
          exit "$result"
      - name: Release build
        run: cargo build --release
      - name: Package Debian and AppImage
        run: bash scripts/package-linux.sh 0.1.0
      - uses: actions/upload-artifact@v4
        with:
          name: notebook-rs-linux
          path: |
            dist/*
            Cargo.lock
            target/release/notebook-rs
          retention-days: 14

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Resolve dependencies
        run: cargo generate-lockfile
      - name: Test
        shell: pwsh
        run: |
          cargo test --color never *> build.log
          $result = $LASTEXITCODE
          Get-Content build.log
          if ($result -ne 0) {
            $raw = Get-Content build.log -Raw
            $escaped = $raw.Substring([Math]::Max(0, $raw.Length - 2700)).Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error title=Rust diagnostics::$escaped"
          }
          exit $result
      - name: Release build
        run: cargo build --release
      - name: Prepare executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/notebook-rs.exe dist/notebook-rs_0.1.0_windows_x86_64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: notebook-rs-windows
          path: dist/*
          retention-days: 14
