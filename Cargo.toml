[package]
name = "notebook-rs"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A local-first, source-grounded research notebook and AI studio written in Rust"
repository = "https://github.com/chrisandreou-sys/Notebook"

[[bin]]
name = "notebook-rs"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["multipart"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
pdf-extract = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusttype = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
zip = { version = "0.6", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
